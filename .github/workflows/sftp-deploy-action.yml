name: Deploy to SFTP
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: |
          npm install
          npm run build

      - name: Deploy via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -u ${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }} sftp://${{ secrets.SFTP_SERVER_URL }} -e "
            set sftp:auto-confirm yes;
            mirror --reverse --delete --verbose ./dist/ ./public_html/;
            quit
          "
